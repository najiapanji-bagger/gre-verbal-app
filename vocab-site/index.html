<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Vocab Buddy — LocalStorage + API Enrichment</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>html,body,#root{height:100%}</style>
</head>
<body class="bg-gray-50 text-gray-900">
  <!-- Tailwind safelist for dynamic status colors -->
  <div class="hidden bg-green-50 text-green-700 border-green-300 bg-amber-50 text-amber-700 border-amber-300 bg-red-50 text-red-700 border-red-300"></div>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useEffect, useMemo, useState } = React;

    // =============================
    // Storage shim (handles sandbox)
    // =============================
    function createSafeStore(namespace) {
      const mem = { value: null };
      let localOk = false;
      try {
        const k = `__test_${namespace}__`;
        window.localStorage.setItem(k, "1");
        window.localStorage.removeItem(k);
        localOk = true;
      } catch (err) {
        localOk = false; // e.g. sandbox blocks localStorage
      }
      return {
        localOk: () => localOk,
        load(defaultVal) {
          if (localOk) {
            try {
              const raw = window.localStorage.getItem(namespace);
              if (!raw) return defaultVal;
              const parsed = JSON.parse(raw);
              return Array.isArray(parsed) ? parsed : defaultVal;
            } catch (e) {
              return defaultVal;
            }
          } else {
            return mem.value ?? defaultVal;
          }
        },
        save(value) {
          if (localOk) {
            try {
              window.localStorage.setItem(namespace, JSON.stringify(value));
            } catch (e) {
              // quota or later failure -> fall back silently
              mem.value = value;
              localOk = false;
            }
          } else {
            mem.value = value;
          }
        },
        clear() {
          try { if (localOk) window.localStorage.removeItem(namespace); } catch {}
          mem.value = null;
        }
      };
    }

    // ===== Utilities =====
    const STORAGE_KEY = 'daily-vocab-words-single';
    const storeRef = { current: createSafeStore(STORAGE_KEY) };

    const DATE_FMT = (d = new Date()) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };
    const uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(36).slice(2)}`);

    const defaultStats = () => ({ attempts: 0, correct: 0, wrong: 0, streak: 0, lastResult: null, lastAnsweredAt: null, accuracy: 0 });
    const uniqueList = (arr=[]) => Array.from(new Set(arr.map(s => (s||'').trim()).filter(Boolean)));

    const needsWork = (w) => {
      const s = w.stats || defaultStats();
      if (s.attempts === 0) return false; // not judged yet
      return s.accuracy < 0.85 || s.lastResult === 'wrong';
    };
    const mastered = (w) => {
      const s = w.stats || defaultStats();
      return s.attempts >= 3 && s.accuracy >= 0.85 && s.lastResult === 'correct';
    };

    // =====================
    // API helpers (Dictionary API)
    // =====================
    function extractFromAPI(data) {
      const synonyms = [];
      const antonyms = [];
      const examples = [];
      if (!Array.isArray(data)) return { synonyms, antonyms, examples };
      for (const entry of data) {
        const meanings = entry?.meanings || [];
        for (const meaning of meanings) {
          if (Array.isArray(meaning?.synonyms)) synonyms.push(...meaning.synonyms);
          if (Array.isArray(meaning?.antonyms)) antonyms.push(...meaning.antonyms);
          const defs = meaning?.definitions || [];
          for (const def of defs) {
            if (Array.isArray(def?.synonyms)) synonyms.push(...def.synonyms);
            if (Array.isArray(def?.antonyms)) antonyms.push(...def.antonyms);
            if (def?.example) examples.push(def.example);
          }
        }
      }
      return {
        synonyms: uniqueList(synonyms).slice(0, 30),
        antonyms: uniqueList(antonyms).slice(0, 30),
        examples: uniqueList(examples).slice(0, 5)
      };
    }

    async function fetchDictionary(word, { timeoutMs = 7000 } = {}) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`, { signal: ctrl.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        return extractFromAPI(json);
      } finally {
        clearTimeout(t);
      }
    }

    // =====================
    // Pure quiz construction
    // =====================
    function pickDecoys(avoid, words) {
      const fromWords = words.map(w => w.text).filter(t => !avoid.includes(t.toLowerCase()));
      const FALLBACKS = ['banana','mountain','camera','window','galaxy','robot','lantern','pepper','horizon','festival','granite','harbor'];
      const bag = [...fromWords, ...FALLBACKS];
      const decoySet = new Set();
      while (decoySet.size < 3 && bag.length) {
        const pick = bag.splice(Math.floor(Math.random()*bag.length),1)[0];
        if (pick && !avoid.includes(pick.toLowerCase())) decoySet.add(pick);
      }
      return Array.from(decoySet);
    }

    function makeQuestionFor(word, words) {
      const hasSyns = (word.synonyms || []).length > 0;
      const hasAnts = (word.antonyms || []).length > 0;
      let kind = 'def';
      if (hasSyns && hasAnts) kind = Math.random() < 0.66 ? 'syn' : 'ant';
      else if (hasSyns) kind = 'syn';
      else if (hasAnts) kind = 'ant';

      let prompt = '';
      let options = new Array(4).fill(null);
      const correctIndex = Math.floor(Math.random() * 4);

      if (kind === 'syn') {
        const correct = word.synonyms[Math.floor(Math.random() * word.synonyms.length)];
        prompt = `Which one is a synonym of "${word.text}"?`;
        const avoid = [correct.toLowerCase(), word.text.toLowerCase(), ...(word.synonyms||[]).map(s=>s.toLowerCase())];
        const decoys = pickDecoys(avoid, words);
        options[correctIndex] = correct; let j=0; for(let i=0;i<4;i++) if(options[i]==null) options[i]=decoys[j++];
      } else if (kind === 'ant') {
        const correct = word.antonyms[Math.floor(Math.random() * word.antonyms.length)];
        prompt = `Which one is an antonym of "${word.text}"?`;
        const avoid = [correct.toLowerCase(), word.text.toLowerCase(), ...(word.antonyms||[]).map(a=>a.toLowerCase())];
        const decoys = pickDecoys(avoid, words);
        options[correctIndex] = correct; let j=0; for(let i=0;i<4;i++) if(options[i]==null) options[i]=decoys[j++];
      } else {
        const correct = word.text;
        prompt = `Which word matches this meaning: “${word.arti || '— no meaning set —'}”?`;
        const avoid = [correct.toLowerCase()];
        const decoyPool = words.filter(w => w.id !== word.id).map(w => w.text);
        let decoys = [];
        if (decoyPool.length >= 3) {
          const pool2 = [...decoyPool];
          while (decoys.length < 3 && pool2.length) {
            const pick = pool2.splice(Math.floor(Math.random()*pool2.length),1)[0];
            if (pick && !avoid.includes(pick.toLowerCase())) decoys.push(pick);
          }
        } else {
          decoys = pickDecoys(avoid, words);
        }
        options[correctIndex] = correct; let j=0; for(let i=0;i<4;i++) if(options[i]==null) options[i]=decoys[j++];
      }

      return { kind, prompt, options, correctIndex };
    }

    // ===== App =====
    function App() {
      const [words, setWords] = useState(() => storeRef.current.load([]));

      // add form
      const [wText, setWText] = useState('');
      const [wMeaning, setWMeaning] = useState('');
      const [wSyns, setWSyns] = useState('');
      const [wAnts, setWAnts] = useState('');
      const [wExamples, setWExamples] = useState('');

      // filters
      const [dateFilter, setDateFilter] = useState('');
      const [statusFilter, setStatusFilter] = useState('all'); // all|needs|mastered|new
      const [search, setSearch] = useState('');

      // quiz
      const [openQuiz, setOpenQuiz] = useState(false);
      const [qWord, setQWord] = useState(null);
      const [qPrompt, setQPrompt] = useState('');
      const [qOptions, setQOptions] = useState([]);
      const [qCorrectIndex, setQCorrectIndex] = useState(-1);
      const [qPicked, setQPicked] = useState(null);
      const [qKind, setQKind] = useState('syn'); // syn | ant | def

      // API enrichment controls
      const [autoFetch, setAutoFetch] = useState(true);
      const [loadingIds, setLoadingIds] = useState(() => new Set()); // ids being enriched

      // inline edit per word
      const [editId, setEditId] = useState(null);
      const [editMeaning, setEditMeaning] = useState('');
      const [editSyns, setEditSyns] = useState('');
      const [editAnts, setEditAnts] = useState('');
      const [editExamples, setEditExamples] = useState('');

      // persist safely
      useEffect(() => {
        storeRef.current.save(words);
      }, [words]);

      const todaysCount = useMemo(() => words.filter(w => w.addedOn === DATE_FMT()).length, [words]);

      // derived list with filters
      const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        return words.filter(w => {
          if (dateFilter && w.addedOn !== dateFilter) return false;
          if (statusFilter === 'needs' && !needsWork(w)) return false;
          if (statusFilter === 'mastered' && !mastered(w)) return false;
          if (statusFilter === 'new' && (w.stats?.attempts || 0) > 0) return false;
          if (q && !w.text.toLowerCase().includes(q)) return false;
          return true;
        });
      }, [words, dateFilter, statusFilter, search]);

      // Enrich a word via API
      async function enrichWordById(id) {
        const w = words.find(x => x.id === id);
        if (!w) return;
        try {
          setLoadingIds(prev => new Set(prev).add(id));
          const api = await fetchDictionary(w.text);
          setWords(prev => prev.map(item => item.id !== id ? item : {
            ...item,
            synonyms: uniqueList([...(item.synonyms||[]), ...(api.synonyms||[])]),
            antonyms: uniqueList([...(item.antonyms||[]), ...(api.antonyms||[])]),
            examples: uniqueList([...(item.examples||[]), ...(api.examples||[])])
          }));
        } catch (e) {
          // swallow; keep manual data
          console.warn('enrich failed', e);
        } finally {
          setLoadingIds(prev => { const s = new Set(prev); s.delete(id); return s; });
        }
      }

      // add word
      const addWord = async () => {
        const text = wText.trim();
        if (!text) return;
        if (words.some(w => w.text.toLowerCase() === text.toLowerCase())) {
          setWText('');
          return;
        }
        const item = {
          id: uid(),
          text,
          arti: wMeaning.trim() || '',
          synonyms: uniqueList(wSyns.split(',').map(s => s.trim())),
          antonyms: uniqueList(wAnts.split(',').map(s => s.trim())),
          examples: uniqueList(wExamples.split(',').map(s => s.trim())),
          addedOn: DATE_FMT(),
          stats: defaultStats()
        };
        setWords(prev => [item, ...prev]);
        setWText(''); setWMeaning(''); setWSyns(''); setWAnts(''); setWExamples('');
        if (autoFetch) enrichWordById(item.id);
      };

      const removeWord = (id) => setWords(prev => prev.filter(w => w.id !== id));
      const resetStats = (id) => setWords(prev => prev.map(w => w.id === id ? { ...w, stats: defaultStats() } : w));

      // edit helpers
      const openEdit = (w) => {
        setEditId(w.id);
        setEditMeaning(w.arti || '');
        setEditSyns((w.synonyms || []).join(', '));
        setEditAnts((w.antonyms || []).join(', '));
        setEditExamples((w.examples || []).join(', '));
      };
      const saveEdit = (id) => {
        setWords(prev => prev.map(w => w.id === id ? {
          ...w,
          arti: editMeaning.trim(),
          synonyms: uniqueList(editSyns.split(',').map(s=>s.trim())),
          antonyms: uniqueList(editAnts.split(',').map(s=>s.trim())),
          examples: uniqueList(editExamples.split(',').map(s=>s.trim())),
        } : w));
        setEditId(null);
      };

      // quiz generation (local + maybe fetch if empty)
      const startQuiz = async (pool = filtered.length ? filtered : words) => {
        if (!pool.length) return;
        let word = pool[Math.floor(Math.random() * pool.length)];
        if (autoFetch && (!word.synonyms?.length && !word.antonyms?.length)) {
          await enrichWordById(word.id);
          const refreshed = words.find(w => w.id === word.id) || word;
          word = refreshed;
        }
        const q = makeQuestionFor(word, words);
        setQKind(q.kind); setQWord(word); setQPrompt(q.prompt); setQOptions(q.options); setQCorrectIndex(q.correctIndex); setQPicked(null); setOpenQuiz(true);
      };

      const answer = (idx) => {
        if (qPicked !== null) return; // already answered
        setQPicked(idx);
        const isCorrect = idx === qCorrectIndex;
        setWords(prev => prev.map(w => {
          if (!qWord || w.id !== qWord.id) return w;
          const s = { ...(w.stats || defaultStats()) };
          s.attempts += 1;
          if (isCorrect) { s.correct += 1; s.streak = (s.lastResult==='correct'? s.streak+1:1); s.lastResult='correct'; }
          else { s.wrong += 1; s.streak = 0; s.lastResult='wrong'; }
          s.lastAnsweredAt = new Date().toISOString();
          s.accuracy = s.correct / s.attempts;
          return { ...w, stats: s };
        }));
      };

      const StatusBadge = ({w}) => {
        const s = w.stats || defaultStats();
        const cls = needsWork(w) ? 'bg-amber-50 text-amber-700 border-amber-300' : mastered(w) ? 'bg-green-50 text-green-700 border-green-300' : 'bg-gray-50 text-gray-700 border-gray-300';
        const label = needsWork(w) ? 'Needs work' : mastered(w) ? 'Mastered' : s.attempts>0 ? 'Learning' : 'New';
        return <span className={`px-2 py-0.5 text-xs rounded-full border ${cls}`}>{label}</span>;
      };

      // =====================
      // Minimal self-tests (+ API parser)
      // =====================
      const [tests, setTests] = useState([]);
      useEffect(() => {
        const results = [];
        // Test 1: storage read/write (and fallback)
        try {
          const tmpNs = `__test_${Date.now()}__`;
          const st = createSafeStore(tmpNs);
          const baseline = [{ id: 't', text: 'alpha' }];
          st.save(baseline);
          const got = st.load([]);
          results.push({ name: 'storage: save & load', pass: Array.isArray(got) && got[0]?.text === 'alpha', info: st.localOk()? 'localStorage' : 'memory' });
        } catch (e) {
          results.push({ name: 'storage: save & load', pass: false, info: String(e) });
        }
        // Test 2: uniqueList trims & dedupes
        const UL = uniqueList([' a ', 'A', '', 'b','a']);
        results.push({ name: 'uniqueList()', pass: UL.includes('a') && UL.includes('A') && UL.includes('b'), info: UL.join('|') });
        // Test 3: API extractor shape
        const mock = [{ meanings:[{ synonyms:['x','y'], antonyms:['z'], definitions:[{ example:'ex1', synonyms:['y','q'] }]}] }];
        const ex = extractFromAPI(mock);
        results.push({ name: 'extractFromAPI()', pass: ex.synonyms.length>=2 && ex.antonyms.length>=1 && ex.examples.length>=1, info: `${ex.synonyms.length}/${ex.antonyms.length}/${ex.examples.length}` });
        // Test 4: quiz builder basic
        const sample = { id:'x', text:'bright', arti:'cerah', synonyms:['shiny','luminous'], antonyms:['dim'] };
        const q = makeQuestionFor(sample, [sample]);
        results.push({ name: 'quiz builder', pass: q && q.options && q.options.length === 4 && q.correctIndex >= 0, info: q.kind });
        setTests(results);
      }, []);

      return (
        <div className="max-w-3xl mx-auto p-6">
          <header className="mb-6">
            <h1 className="text-3xl font-bold tracking-tight">Daily Vocab Buddy</h1>
            <p className="text-gray-600">LocalStorage + optional API enrichment • words by date • synonyms, antonyms, examples • mistake tracking.</p>
            <div className="mt-2 text-xs text-gray-500">Storage: {storeRef.current.localOk() ? 'localStorage ✅' : 'in-memory fallback ⚠️ (refresh will reset)'}</div>
          </header>

          {/* Add word */}
          <section className="bg-white rounded-2xl shadow p-4 mb-6">
            <div className="grid gap-3 sm:grid-cols-2">
              <input className="rounded-xl border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Word (required)" value={wText} onChange={e=>setWText(e.target.value)} onKeyDown={(e)=>{ if(e.key==='Enter') addWord(); }} />
              <input className="rounded-xl border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Meaning / arti (optional)" value={wMeaning} onChange={e=>setWMeaning(e.target.value)} />
              <input className="rounded-xl border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Synonyms (comma-separated)" value={wSyns} onChange={e=>setWSyns(e.target.value)} />
              <input className="rounded-xl border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Antonyms (comma-separated)" value={wAnts} onChange={e=>setWAnts(e.target.value)} />
              <input className="rounded-xl border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 sm:col-span-2" placeholder="Examples (comma-separated)" value={wExamples} onChange={e=>setWExamples(e.target.value)} />
            </div>
            <div className="mt-3 flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
              <div className="flex items-center gap-3">
                <button className="rounded-xl px-4 py-2 bg-indigo-600 text-white hover:bg-indigo-700 active:scale-[0.98]" onClick={addWord}>Save word</button>
                <label className="flex items-center gap-2 text-sm text-gray-700">
                  <input type="checkbox" checked={autoFetch} onChange={e=>setAutoFetch(e.target.checked)} />
                  Auto fetch from Dictionary API
                </label>
              </div>
              <span className="text-xs text-gray-500">Today: {todaysCount}</span>
            </div>
          </section>

          {/* Controls */}
          <section className="bg-white rounded-2xl shadow p-4 mb-6">
            <div className="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
              <div className="flex flex-wrap items-end gap-3">
                <div>
                  <label className="block text-xs text-gray-500">Filter by date</label>
                  <input type="date" className="rounded-xl border border-gray-300 px-3 py-2" value={dateFilter} onChange={e=>setDateFilter(e.target.value)} />
                </div>
                <div>
                  <label className="block text-xs text-gray-500">Status</label>
                  <select className="rounded-xl border border-gray-300 px-3 py-2" value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
                    <option value="all">All</option>
                    <option value="new">New</option>
                    <option value="needs">Needs work</option>
                    <option value="mastered">Mastered</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-gray-500">Search</label>
                  <input className="rounded-xl border border-gray-300 px-3 py-2" placeholder="word…" value={search} onChange={e=>setSearch(e.target.value)} />
                </div>
                <button className="text-sm text-indigo-600 hover:underline" onClick={()=>{ setDateFilter(DATE_FMT()); setStatusFilter('all'); }}>Today only</button>
                <button className="text-sm text-gray-600 hover:underline" onClick={()=>{ setDateFilter(''); setStatusFilter('all'); setSearch(''); }}>Clear filters</button>
              </div>
              <div className="flex items-center gap-2">
                <button className="rounded-xl px-4 py-2 bg-emerald-600 text-white hover:bg-emerald-700" onClick={()=>startQuiz()}>Start quiz</button>
                <button className="rounded-xl px-3 py-2 border border-gray-300 hover:bg-gray-50 text-sm" onClick={async()=>{
                  for (const w of words) { await enrichWordById(w.id); }
                }}>Enrich all</button>
                <button className="rounded-xl px-3 py-2 border border-gray-300 hover:bg-gray-50 text-sm" onClick={()=>{
                  const blob = new Blob([JSON.stringify(words,null,2)], {type:'application/json'});
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url; a.download = `vocab_${DATE_FMT()}.json`; a.click();
                  setTimeout(()=>URL.revokeObjectURL(url), 1000);
                }}>Export JSON</button>
              </div>
            </div>
          </section>

          {/* Word list */}
          <section className="bg-white rounded-2xl shadow p-4">
            <div className="flex items-center justify-between mb-2">
              <h2 className="text-lg font-semibold">Your words</h2>
              <span className="text-sm text-gray-500">{filtered.length} shown · {words.length} total</span>
            </div>
            {filtered.length === 0 ? (
              <p className="text-gray-500">No words match the current filters.</p>
            ) : (
              <ul className="divide-y">
                {filtered.map(w => (
                  <li key={w.id} className="py-3 flex items-start justify-between gap-3">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <div className="font-medium break-words">{w.text}</div>
                        <StatusBadge w={w} />
                        {loadingIds.has(w.id) && <span className="text-xs text-gray-500">updating…</span>}
                      </div>
                      {w.arti && <div className="text-sm text-gray-700">🇮🇩 {w.arti}</div>}
                      {w.synonyms?.length > 0 && (
                        <div className="text-xs text-gray-500">Synonyms: {w.synonyms.join(', ')}</div>
                      )}
                      {w.antonyms?.length > 0 && (
                        <div className="text-xs text-gray-500">Antonyms: {w.antonyms.join(', ')}</div>
                      )}
                      {w.examples?.length > 0 && (
                        <ul className="mt-1 text-xs text-gray-600 list-disc list-inside space-y-0.5">
                          {w.examples.slice(0,3).map((ex,i)=> <li key={i} className="italic">"{ex}"</li>)}
                        </ul>
                      )}
                      <div className="text-xs text-gray-500 mt-1">added {w.addedOn}</div>
                      <div className="mt-1 flex items-center gap-3 text-xs text-gray-600">
                        <span>Attempts: {w.stats.attempts}</span>
                        <span>Correct: {w.stats.correct}</span>
                        <span>Wrong: {w.stats.wrong}</span>
                        <span>Acc: {(w.stats.accuracy*100).toFixed(0)}%</span>
                      </div>

                      {/* inline edit */}
                      {editId === w.id && (
                        <div className="mt-3 p-3 border border-gray-200 rounded-xl bg-gray-50">
                          <div className="grid gap-2 sm:grid-cols-2">
                            <input className="rounded-lg border border-gray-300 px-2 py-1" placeholder="Meaning" value={editMeaning} onChange={e=>setEditMeaning(e.target.value)} />
                            <input className="rounded-lg border border-gray-300 px-2 py-1" placeholder="Synonyms (comma)" value={editSyns} onChange={e=>setEditSyns(e.target.value)} />
                            <input className="rounded-lg border border-gray-300 px-2 py-1" placeholder="Antonyms (comma)" value={editAnts} onChange={e=>setEditAnts(e.target.value)} />
                            <input className="rounded-lg border border-gray-300 px-2 py-1 sm:col-span-2" placeholder="Examples (comma)" value={editExamples} onChange={e=>setEditExamples(e.target.value)} />
                          </div>
                          <div className="mt-2 flex gap-2">
                            <button className="rounded-lg px-3 py-1 bg-indigo-600 text-white hover:bg-indigo-700" onClick={()=>saveEdit(w.id)}>Save</button>
                            <button className="rounded-lg px-3 py-1 border border-gray-300 hover:bg-white" onClick={()=>setEditId(null)}>Cancel</button>
                          </div>
                        </div>
                      )}
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <button className="text-indigo-600 hover:text-indigo-800 text-sm" onClick={()=>startQuiz([w])}>Quiz</button>
                      <button className="text-sky-600 hover:text-sky-800 text-sm" onClick={()=>enrichWordById(w.id)}>Fetch</button>
                      {editId === w.id ? null : <button className="text-gray-600 hover:text-gray-800 text-sm" onClick={()=>openEdit(w)}>Edit</button>}
                      <button className="text-gray-600 hover:text-gray-800 text-sm" onClick={()=>resetStats(w.id)}>Reset</button>
                      <button className="text-rose-600 hover:text-rose-700 text-sm" onClick={()=>removeWord(w.id)}>Delete</button>
                    </div>
                  </li>
                ))}
              </ul>
            )}
          </section>

          {/* Quiz modal */}
          {openQuiz && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50" onClick={()=>setOpenQuiz(false)}>
              <div className="bg-white rounded-2xl shadow-xl max-w-xl w-full" onClick={(e)=>e.stopPropagation()}>
                <div className="p-6">
                  <div className="flex items-start justify-between mb-4">
                    <div>
                      <div className="text-xs text-gray-500">Word</div>
                      <h3 className="text-2xl font-bold">{qWord?.text}</h3>
                      <div className="text-xs text-gray-500">added {qWord?.addedOn}</div>
                    </div>
                    <button className="text-gray-500 hover:text-gray-700" onClick={()=>setOpenQuiz(false)}>✕</button>
                  </div>
                  <p className="mb-4 text-gray-800">{qPrompt}</p>
                  <div className="grid gap-3">
                    {qOptions.map((opt,i)=>{
                      const answered = qPicked !== null;
                      let cls = 'rounded-xl px-3 py-2 border text-left text-sm transition-colors ';
                      if (!answered) cls += 'border-gray-300 hover:bg-gray-50';
                      else if (i === qCorrectIndex) cls += 'border-green-300 bg-green-50 text-green-700';
                      else if (i === qPicked && i !== qCorrectIndex) cls += 'border-red-300 bg-red-50 text-red-700';
                      else cls += 'border-gray-200 bg-gray-50';
                      return (
                        <button key={i} disabled={answered} onClick={()=>answer(i)} className={cls}>{opt}</button>
                      );
                    })}
                  </div>
                  <div className="mt-5 flex items-center justify-between">
                    <button className="rounded-lg px-3 py-1 border border-gray-300 hover:bg-gray-50" onClick={()=>startQuiz()}>Next</button>
                    {qPicked !== null && (
                      <div className="text-sm text-gray-600">
                        {qPicked === qCorrectIndex ? 'Correct ✅' : 'Not quite ❌'} {qKind==='syn' ? '(synonym)' : qKind==='ant' ? '(antonym)' : '(definition)'}
                      </div>
                    )}
                  </div>

                  {/* show examples for context */}
                  {qWord?.examples?.length > 0 && (
                    <div className="mt-4">
                      <div className="text-sm font-semibold mb-1">Examples</div>
                      <ul className="text-sm text-gray-700 list-disc list-inside space-y-0.5">
                        {qWord.examples.slice(0,3).map((ex,i)=> <li key={i} className="italic">"{ex}"</li>)}
                      </ul>
                    </div>
                  )}
                </div>
                <div className="px-6 py-3 border-t text-xs text-gray-500">Powered by <a href="https://dictionaryapi.dev/" target="_blank" rel="noreferrer" className="underline">Dictionary API</a> • Data may vary by word</div>
              </div>
            </div>
          )}

          {/* Diagnostics */}
          <details className="mt-6 bg-white rounded-2xl shadow p-4">
            <summary className="cursor-pointer select-none font-medium">Diagnostics & Self‑tests</summary>
            <div className="mt-2 text-sm text-gray-700">
              <div>Environment storage: <b>{storeRef.current.localOk() ? 'localStorage' : 'in-memory (fallback)'}</b></div>
              <ul className="mt-2 space-y-1">
                {tests.map((t,i)=> (
                  <li key={i} className={t.pass ? 'text-green-700' : 'text-red-700'}>
                    {t.pass ? '✓' : '✗'} {t.name} <span className="text-gray-500">{t.info ? '— ' + t.info : ''}</span>
                  </li>
                ))}
              </ul>
            </div>
          </details>

          <footer className="mt-10 text-sm text-gray-500">
            Tip: tambah <span className="font-medium">synonyms/antonyms/examples</span> biar kuis makin variatif. Kata berstatus <span className="font-medium">Needs work</span> adalah yang salah terakhir atau akurasi &lt; 85%.
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
